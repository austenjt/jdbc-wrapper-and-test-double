# Cucumber configuration, read automatically by the Cucumber JUnit Platform engine.

# Where the Java step definitions live.
cucumber.glue=org.example.steps

# Report outputs:
#   pretty  -> readable console output
#   html    -> a self-contained single-file report (always produced)
#   json    -> consumed by maven-cucumber-reporting to build the rich HTML report
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json

# Don't prompt about publishing reports to the Cucumber cloud service.
cucumber.publish.quiet=true

# Show each scenario using its plain-English name.
cucumber.execution.dry-run=false
